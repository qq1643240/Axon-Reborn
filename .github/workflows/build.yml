name: Build Axon Reborn

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        submodules: recursive
        
    - name: Install dependencies
      run: |
        brew install dpkg ldid xz
        
    - name: Download and setup iOS SDK
      run: |
        export THEOS=$(pwd)/theos
        mkdir -p $THEOS/sdks
        
        echo "Downloading iOS SDK..."
        curl -L --fail -o /tmp/sdk.tar.gz \
          "https://github.com/chrisharper22/sdks/releases/download/iOS14.5/iPhoneOS14.5.sdk.tar.gz" || \
        curl -L --fail -o /tmp/sdk.tar.gz \
          "https://github.com/xybp888/iOS-SDKs/releases/download/14.5/iPhoneOS14.5.sdk.tar.gz" || \
        curl -L --fail -o /tmp/sdk.tar.gz \
          "https://github.com/kabiroberai/ios-sdks/releases/download/14.5/iPhoneOS14.5.sdk.tar.gz"
        
        ls -la /tmp/sdk.tar.gz
        file /tmp/sdk.tar.gz
        
        cd $THEOS/sdks
        tar -xzf /tmp/sdk.tar.gz
        rm /tmp/sdk.tar.gz
        
        ls -la $THEOS/sdks/
        
    - name: Download libroot
      run: |
        export THEOS=$(pwd)/theos
        mkdir -p $THEOS/lib
        curl -L -o $THEOS/lib/libroothide.dylib \
          "https://raw.githubusercontent.com/opa334/libroot/main/libroothide.dylib" || true
        ls -la $THEOS/lib/
        
    - name: Build Tweak
      run: |
        export THEOS=$(pwd)/theos
        echo "THEOS=$THEOS"
        ls -la $THEOS/sdks/
        make clean
        make package
        ls -la packages/
        
    - name: Upload DEB artifact
      uses: actions/upload-artifact@v4
      with:
        name: Axon-Reborn-Deb
        path: packages/*.deb
        
    - name: Create Release
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: packages/*.deb
        body: |
          Axon Reborn - iOS 14-16 Rootless/RootHide
          
          ## 新功能
          - 支持 iOS 14-16 无根/隐根越狱
          - 上滑图标清除单个应用通知
          - 下滑图标清除全部通知
          
          ## 安装
          通过 Sileo/Filza 安装此 deb 包
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
